apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  # language=yaml
  valuesContent: |
    service:
      spec:
        externalTrafficPolicy: Local
    
    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    
    # Performance tuning
    additionalArguments:
      # Redirect HTTP to HTTPS
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.permanent=true"

      # Trust forwarded headers from local network only
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32,192.168.178.0/24,10.0.0.0/8"
      
      # Connection pooling
      - "--serversTransport.maxIdleConnsPerHost=200"
      
      # Timeouts
      # writeTimeout bounds the total time spent writing a single response, so any
      # finite value kills long-lived streams (IPTV/MPEG-TS, SSE) at that mark.
      # 300s here was cutting Dispatcharr streams at exactly 5 minutes.
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=600s"
      
      # Disable unnecessary features
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      
      # Access logs
      - "--accesslog=true"
      - "--accesslog.bufferingsize=100"
      
      # Default chain
      - "--entryPoints.websecure.http.middlewares=kube-system-default-chain@kubernetescrd"
---
# Nextcloud user data, mounted read-only so Immich can index the existing
# photos as an external library. Separate PV on the same host path as
# nextcloud-pv, since a PV can only ever be bound to a single claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-nextcloud-data-pv
spec:
  capacity:
    storage: 150Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/internal/nextcloud/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homeserver
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-nextcloud-data-pvc
  namespace: immich
spec:
  storageClassName: local-storage
  volumeName: immich-nextcloud-data-pv
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 150Gi

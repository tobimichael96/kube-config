apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: static-sites
  namespace: websites
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 5m
  releaseName: static-sites
  targetNamespace: websites
  values:
    controllers:
      static-sites:
        containers:
          app:
            image:
              repository: nginx
              tag: alpine3.23
            resources:
              limits:
                cpu: 10m
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
    service:
      app:
        controller: static-sites
        ports:
          http:
            port: 80
    ingress:
      app:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts:
          - host: tobiasmichael.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: www.tobiasmichael.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: tm28.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: tmem.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: selinaeffner.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: www.selinaeffner.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: moto.tmem.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: tobieffner.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: www.tobieffner.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - tobiasmichael.de
              - www.tobiasmichael.de
              - tm28.de
              - tmem.de
            secretName: tobiasmichael-tls
          - hosts:
              - selinaeffner.de
              - www.selinaeffner.de
            secretName: selina-tls
          - hosts:
              - moto.tmem.de
            secretName: moto-tls
          - hosts:
              - tobieffner.com
              - www.tobieffner.com
            secretName: tobieffner-tls
    configMaps:
      nginx-config:
        data:
          default.conf: |
            # tobieffner.com logs no visitor data (no IP, referrer or user agent), as promised
            # in its privacy policy
            log_format noip '[$time_local] "$request" $status $body_bytes_sent';
            # don't reveal the nginx version in headers and error pages
            server_tokens off;
            server {
                listen 80;
                server_name tobiasmichael.de www.tobiasmichael.de tm28.de tmem.de;
                root /usr/share/nginx/html/tobiasmichael;
                index index.html;
                # like tobieffner.com, but allows the Font Awesome and Google Fonts CDNs, the S3
                # favicon of the error page and the two inline handlers (by hash) of index.html
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-xdNdObpXwEuCjFC4nj277YejP1urF6Q905L6c0T+FFo=' 'sha256-GZIcz60Uwd6wT3vaYke/atSr53TehbYAPepOa3d03Vw='; style-src 'self' https://use.fontawesome.com https://fonts.googleapis.com; font-src 'self' https://use.fontawesome.com https://fonts.gstatic.com; img-src 'self' https://tm-website-static.s3.eu-central-1.amazonaws.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
            }
            server {
                listen 80;
                server_name selinaeffner.de www.selinaeffner.de;
                root /usr/share/nginx/html/selina;
                index index.html;
            }
            server {
                listen 80;
                server_name moto.tmem.de;
                root /usr/share/nginx/html/moto;
                index index.html;
            }
            server {
                listen 80;
                server_name tobieffner.com www.tobieffner.com;
                root /usr/share/nginx/html/tobieffner;
                index index.html;
                access_log /var/log/nginx/access.log noip;
                # only resources from the site itself, no embedding in other sites' frames
                add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
                error_page 404 /error.html;
                location = /error.html {
                    internal;
                }
            }
    persistence:
      nginx-config:
        type: configMap
        name: static-sites
        globalMounts:
          - path: /etc/nginx/conf.d
      data:
        existingClaim: websites-pvc
        globalMounts:
          - path: /usr/share/nginx/html
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: ollama
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 5m
  releaseName: open-webui
  targetNamespace: ollama
  values:
    controllers:
      open-webui:
        strategy: "Recreate"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: 0.12.5
            env:
              TZ: Europe/Berlin
              OLLAMA_BASE_URL: "http://ollama:11434"
              ENABLE_OPENAI_API: "false"
              WEBUI_URL: "https://openwebui.internal.tmem.de"
              ENABLE_SIGNUP: "false"
              # Only applies while no default is set in Admin Settings (persistent config).
              DEFAULT_MODELS: "qwen3:30b-a3b-instruct-2507-q4_K_M"
              # Same caveat: these were already persisted at first boot, so they were set once in
              # Admin Settings > Web Search and only take effect from here on a fresh database.
              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: "searxng"
              SEARXNG_QUERY_URL: "http://searxng.searxng.svc.cluster.local:8080/search?q=<query>"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
              # First boot downloads the embedding model before /health answers.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 60
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    ingress:
      app:
        enabled: true
        className: "traefik"
        annotations:
          traefik.ingress.kubernetes.io/ssl-redirect: "true"
          traefik.ingress.kubernetes.io/router.middlewares: "kube-system-internal-only@kubernetescrd"
        hosts:
          - host: &host openwebui.internal.tmem.de
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        existingClaim: open-webui-data-pvc
        globalMounts:
          - path: /app/backend/data

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
  namespace: *app
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 5m
  releaseName: *app
  targetNamespace: *app
  values:
    defaultPodOptions:
      runtimeClassName: "nvidia-cdi"
    controllers:
      dispatcharr:
        type: statefulset
        initContainers:
          gluetun:
            restartPolicy: Always
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              TZ: Europe/Berlin
              FIREWALL: on
              FIREWALL_INPUT_PORTS: 9191,9999
              VPN_TYPE: wireguard
              VPN_SERVICE_PROVIDER: mullvad
              # Gluetun starts from its bundled server list (2025-10-03) and only
              # refreshes it after UPDATER_PERIOD, so most German servers it picks
              # are gone or have rotated keys and fail the healthcheck, stretching
              # startup to ~2 minutes. Pin the ones verified against Mullvad's
              # live relay list on 2026-10-12.
              SERVER_HOSTNAMES: de-fra-wg-001,de-fra-wg-002,de-fra-wg-003,de-fra-wg-004,de-fra-wg-005,de-ber-wg-001,de-ber-wg-002
              UPDATER_PERIOD: 12h
              # Do not use gluetun's internal DNS server: it binds [::]:53 while
              # its own resolver dials 127.0.0.1:53 over IPv4, and with no working
              # IPv6 in this netns that fails with "resource temporarily
              # unavailable". Gluetun then cannot resolve its healthcheck targets
              # and restarts its own tunnel in a loop.
              DOT: "off"
              DNS_ADDRESS: 192.168.178.91
              FIREWALL_OUTBOUND_SUBNETS: "192.168.178.91/32"
              HEALTH_SERVER_ADDRESS: "0.0.0.0:9999"
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "15s"
            envFrom:
              - secret: dispatcharr-vpn-config
            # Configure the container-specific securityContext
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
                  - SYS_MODULE
            lifecycle:
              postStart:
                exec:
                  command: [ "/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true" ]
            probes:
              readiness:
                enabled: false
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - wget -qO- https://am.i.mullvad.net/connected | grep -q "You are connected to Mullvad"
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - wget -qO- https://am.i.mullvad.net/connected | grep -q "You are connected to Mullvad"
                  initialDelaySeconds: 0
                  periodSeconds: 2
                  timeoutSeconds: 10
                  failureThreshold: 60
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.33.0
            env:
              TZ: "Europe/Berlin"
              DISPATCHARR_ENV: aio
              POSTGRES_HOST: "localhost"
              REDIS_HOST: "localhost"
              CELERY_BROKER_URL: "redis://localhost:6379/0"
              DISPATCHARR_LOG_LEVEL: info
              NVIDIA_VISIBLE_DEVICES: "all"
              NVIDIA_DRIVER_CAPABILITIES: "all"
              CELERY_NICE_LEVEL: "5"      # Background tasks (higher = lower priority)
              FFMPEG_NICE_LEVEL: "0"      # Transcoding (keep responsive)
              STREAMLINK_NICE_LEVEL: "0"  # Stream fetching
            resources:
              limits:
                cpu: 3000m
                nvidia.com/gpu: 1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9191
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              capabilities:
                add:
                  - SYS_NICE
              allowPrivilegeEscalation: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      gluetun:
        controller: *app
        ports:
          http:
            port: 9999
    ingress:
      app:
        className: "traefik"
        annotations:
          kubernetes.io/tls-acme: "true"
          cert-manager.io/cluster-issuer: "letsencrypt"
          traefik.ingress.kubernetes.io/router.middlewares: "kube-system-internal-only@kubernetescrd"
        hosts:
          - host: &host dispatcharr.internal.tmem.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: dispatcharr-tls
    persistence:
      data:
        existingClaim: dispatcharr-config-pvc
        advancedMounts:
          dispatcharr:
            app:
              - path: /data
      scripts:
        type: configMap
        name: dispatcharr-scripts
        advancedMounts:
          dispatcharr:
            app:
              - path: /scripts
                readOnly: true
      logs:
        type: emptyDir
      tmp:
        type: emptyDir
      vpn-config:
        enabled: true
        type: secret
        name: dispatcharr-vpn-config
        advancedMounts:
          dispatcharr:
            gluetun:
              - path: /gluetun/wireguard/

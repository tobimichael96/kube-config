---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jitsi
  namespace: *app
spec:
  chart:
    spec:
      chart: jitsi-meet
      version: 3.11.1
      sourceRef:
        kind: HelmRepository
        name: *app
        namespace: flux-system
  interval: 5m
  releaseName: *app
  targetNamespace: *app
  values:
    fullnameOverride: *app
    publicURL: https://meet.tmem.de
    tz: Europe/Berlin
    # No login: anyone with the link can open a room. Keep room names unguessable.
    enableAuth: false
    # The chart does not roll pods when their ConfigMaps change
    jicofo:
      annotations:
        reloader.stakater.com/auto: "true"
    web:
      annotations:
        reloader.stakater.com/auto: "true"
      extraEnvs:
        # The group mostly talks without video
        START_WITH_VIDEO_MUTED: "true"
        # Rooms are open, so don't advertise "Start meeting" on the root page.
        # Direct room links keep working.
        ENABLE_WELCOME_PAGE: "false"
        # No Gravatar etc.: browsers only talk to this server
        ENABLE_THIRD_PARTY_REQUESTS: "false"
        # JVB sends every stream out over the home upload, so cap video at 360p
        RESOLUTION: "360"
        RESOLUTION_WIDTH: "640"
        # Fewer buttons for a non-technical group
        TOOLBAR_BUTTONS: "microphone,camera,chat,raisehand,tileview,settings,hangup"
    jvb:
      # Media goes over UDP 10000 straight to the node, not through Traefik.
      # Forward UDP 10000 on the router to the homeserver.
      useHostPort: true
      UDPPort: 10000
      # Public address is discovered via the default external STUN server,
      # so the dynamic home IP is picked up on pod start. public-ip-cronjob.yaml
      # restarts JVB when that IP changes.
      annotations:
        configmap.reloader.stakater.com/reload: jitsi-public-ip
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

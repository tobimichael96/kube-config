---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jitsi
  namespace: *app
spec:
  chart:
    spec:
      chart: jitsi-meet
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: *app
        namespace: flux-system
  interval: 5m
  releaseName: *app
  targetNamespace: *app
  values:
    fullnameOverride: *app
    publicURL: https://meet.tmem.de
    tz: Europe/Berlin
    # Secure domain: only the host account (secrets.yaml) can start a meeting.
    # Everyone else joins as a guest once the host is in the room.
    enableAuth: true
    enableGuests: true
    prosody:
      persistence:
        enabled: true
        existingClaim: jitsi-pvc
      annotations:
        secret.reloader.stakater.com/reload: jitsi-host-account
      # The chart cannot create users. This sidecar creates the host account
      # once prosody is up and resets its password to the one in the Secret,
      # the same way the image's register-setup creates focus and jvb.
      extraInitContainers:
        - name: host-account
          image: ghcr.io/jitsi/prosody:stable-11248
          restartPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -u
              until curl -fs -o /dev/null http://127.0.0.1:5280/health; do sleep 2; done
              cfg=/run/prosody/config/prosody.cfg.lua
              jid="$HOST_USER@meet.jitsi"
              prosodyctl --config "$cfg" shell user create "$jid" "$HOST_PASSWORD" ||
                true
              prosodyctl --config "$cfg" shell user password "$jid" "$HOST_PASSWORD" &&
                echo "host account $jid ready"
              exec sleep infinity
          env:
            - name: HOST_USER
              valueFrom:
                secretKeyRef:
                  name: jitsi-host-account
                  key: username
            - name: HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-host-account
                  key: password
          volumeMounts:
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: prosody-data
              mountPath: /var/lib/prosody
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
    # The chart does not roll pods when their ConfigMaps change
    jicofo:
      annotations:
        reloader.stakater.com/auto: "true"
    web:
      annotations:
        reloader.stakater.com/auto: "true"
      extraEnvs:
        # The group mostly talks without video
        START_WITH_VIDEO_MUTED: "true"
    jvb:
      # Media goes over UDP 10000 straight to the node, not through Traefik.
      # Forward UDP 10000 on the router to the homeserver.
      useHostPort: true
      UDPPort: 10000
      # Public address is discovered via the default external STUN server,
      # so the dynamic home IP is picked up on pod start. public-ip-cronjob.yaml
      # restarts JVB when that IP changes.
      annotations:
        configmap.reloader.stakater.com/reload: jitsi-public-ip
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

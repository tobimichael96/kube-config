apiVersion: v1
kind: PersistentVolume
metadata:
  name: jitsi-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/internal/jitsi
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homeserver
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jitsi-pvc
  namespace: jitsi
spec:
  storageClassName: local-storage
  volumeName: jitsi-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

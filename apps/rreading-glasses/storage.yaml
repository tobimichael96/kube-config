---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rreading-glasses-database-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/internal/rreading-glasses/database
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homeserver
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rreading-glasses-database-pvc
  namespace: rreading-glasses
spec:
  storageClassName: local-storage
  volumeName: rreading-glasses-database-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

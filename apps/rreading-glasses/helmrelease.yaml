---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rreading-glasses
  namespace: *app
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 5m
  releaseName: *app
  targetNamespace: *app
  values:
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
        containers:
          app:
            # Metadata server for Bookshelf, replacing the public api.bookinfo.pro
            # whose /search returns 404. Upstream only publishes `latest`, so the
            # digest pin is what lets Renovate track it.
            image:
              repository: blampe/rreading-glasses
              tag: latest@sha256:e16bedb8e0e6b1a2b2dd67e80b4380f2c4d2db57a2914fe449132df7e8af6245
            command: ["/main", "serve"]
            env:
              UPSTREAM: www.goodreads.com
              PORT: &port 8788
              POSTGRES_HOST: rreading-glasses-database
              TZ: Europe/Berlin
            envFrom:
              - secret: rreading-glasses-db
            # it sizes its in-memory cache from the limit
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /swagger.json
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
      database:
        containers:
          postgres:
            image:
              repository: postgres
              tag: 18.6-alpine
            env:
              TZ: Europe/Berlin
            envFrom:
              - secret: rreading-glasses-db
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            probes:
              liveness: &dbprobes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "rreading-glasses", "-d", "rreading-glasses"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *dbprobes
    service:
      app:
        controller: app
        ports:
          http:
            port: *port
      database:
        controller: database
        ports:
          http:
            port: 5432
    ingress:
      app:
        className: "traefik"
        annotations:
          kubernetes.io/tls-acme: "true"
          cert-manager.io/cluster-issuer: "letsencrypt"
          traefik.ingress.kubernetes.io/router.middlewares: "kube-system-internal-only@kubernetescrd"
        hosts:
          - host: &host rreading-glasses.internal.tmem.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: rreading-glasses-tls
    persistence:
      database:
        existingClaim: rreading-glasses-database-pvc
        advancedMounts:
          database:
            postgres:
              - path: /var/lib/postgresql
      tmp:
        type: emptyDir
        advancedMounts:
          app:
            app:
              - path: /tmp

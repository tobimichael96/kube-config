---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookshelf-config-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/internal/bookshelf/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homeserver
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookshelf-config-pvc
  namespace: bookshelf
spec:
  storageClassName: local-storage
  volumeName: bookshelf-config-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

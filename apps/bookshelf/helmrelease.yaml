---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookshelf
  namespace: *app
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 5m
  releaseName: *app
  targetNamespace: *app
  dependsOn:
    - name: sabnzbd
      namespace: sabnzbd
  values:
    controllers:
      bookshelf:
        type: statefulset
        containers:
          app:
            # Readarr fork; the softcover tag pulls Goodreads metadata from the
            # public rreading-glasses instance (METADATA_URL baked into the image).
            # It's a linuxserver-based image, so s6 starts as root and drops to
            # PUID 911, which rules out the runAsNonRoot setup sonarr/radarr use.
            image:
              repository: ghcr.io/pennydreadful/bookshelf
              tag: softcover-v0.4.21.182
            env:
              TZ: "Europe/Berlin"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 8787
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    ingress:
      app:
        className: "traefik"
        annotations:
          kubernetes.io/tls-acme: "true"
          cert-manager.io/cluster-issuer: "letsencrypt"
          traefik.ingress.kubernetes.io/router.middlewares: "kube-system-internal-only@kubernetescrd"
        hosts:
          - host: &host bookshelf.internal.tmem.de
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: bookshelf-tls
    persistence:
      config:
        existingClaim: bookshelf-config-pvc
      media:
        existingClaim: bookshelf-media-pvc
        globalMounts:
          - path: /mnt/internal/media/audiobooks
      downloads:
        existingClaim: bookshelf-downloads-pvc
        globalMounts:
          - path: /mnt/internal/media/downloads

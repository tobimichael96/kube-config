---
# Traefik serves this when an ingress has no TLS secret of its own. The secret has to
# live in the TLSStore's namespace, hence kube-system.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: internal-wildcard-tls
